name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-15  # Apple Silicon + Xcode 16+ for Swift 6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Log Swift version
        run: swift --version

      # No `restore-keys` fallback on purpose. A prefix fallback restores a
      # .build produced by a *different* dependency set (and possibly a
      # different Xcode, since `latest-stable` floats), which surfaces as
      # confusing stale-artifact failures rather than an honest cache miss.
      # A dependency bump should pay for a clean rebuild.
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}

      # Fail rather than silently rewriting Package.resolved: a lockfile that
      # disagrees with Package.swift means the committed versions are not the
      # ones being tested.
      - name: Verify Package.resolved is up to date
        run: |
          cp Package.resolved Package.resolved.ci-check
          swift package resolve
          if ! diff -q Package.resolved Package.resolved.ci-check >/dev/null; then
            echo "::error::Package.resolved is out of date with Package.swift — run 'swift package resolve' and commit the result."
            diff Package.resolved.ci-check Package.resolved || true
            exit 1
          fi
          rm Package.resolved.ci-check

      # vendor/ is gitignored — Package.swift references binary targets at
      # vendor/sherpa-onnx.xcframework + vendor/onnxruntime.xcframework, so
      # fetch them before any swift command can resolve the package graph.
      - name: Cache sherpa-onnx + ONNX Runtime xcframeworks
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}

      - name: Fetch vendor xcframeworks
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: ./scripts/fetch-sherpa-onnx.sh

      - name: Run tests
        run: swift test
