name: Release

on:
  push:
    tags:
      - 'v*'        # e.g. v1.0.0
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write    # needed to create GitHub releases

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Log Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install ffmpeg-full + dylibbundler
        run: brew install ffmpeg-full dylibbundler

      # vendor/ is gitignored — Package.swift references binary targets at
      # vendor/sherpa-onnx.xcframework + vendor/onnxruntime.xcframework, so
      # fetch them before any swift command can resolve the package graph.
      - name: Cache sherpa-onnx + ONNX Runtime xcframeworks
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}

      - name: Fetch vendor xcframeworks
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: ./scripts/fetch-sherpa-onnx.sh

      - name: Run tests
        run: swift test --parallel

      - name: Build release .app + DMG
        run: ./scripts/build-app.sh --dmg

      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Scribe.app Scribe-${{ steps.version.outputs.version }}.app.zip

      - name: Rename DMG with version
        run: mv dist/Scribe.dmg dist/Scribe-${{ steps.version.outputs.version }}.dmg

      - name: Upload artifacts (always, even without tag)
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-${{ steps.version.outputs.version }}
          path: |
            dist/Scribe-*.dmg
            dist/Scribe-*.app.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Scribe-*.dmg
            dist/Scribe-*.app.zip
          body: |
            ## Installation

            1. Download `Scribe-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG and drag **Scribe** to Applications
            3. On first launch, right-click → **Open** to bypass Gatekeeper (app is ad-hoc signed without Apple Developer ID)

            ## Requirements
            - macOS 15 (Sequoia) or later
            - Apple Silicon (M1 or later) required

            **ffmpeg with libass is bundled** — no separate install needed for subtitle burning. The Qwen3 ASR engines and live captions models download on first use (~342 MB to ~1 GB depending on selection).
