name: Release

on:
  push:
    tags:
      - 'v*'        # e.g. v1.0.0
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write    # needed to create GitHub releases

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install ffmpeg-full (has libass for subtitle burning)
        run: brew install ffmpeg-full

      - name: Run tests
        run: swift test --parallel

      - name: Build release .app + DMG
        run: ./scripts/build-app.sh --dmg

      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Scribe.app Scribe-${{ steps.version.outputs.version }}.app.zip

      - name: Rename DMG with version
        run: mv dist/Scribe.dmg dist/Scribe-${{ steps.version.outputs.version }}.dmg

      - name: Upload artifacts (always, even without tag)
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-${{ steps.version.outputs.version }}
          path: |
            dist/Scribe-*.dmg
            dist/Scribe-*.app.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Scribe-*.dmg
            dist/Scribe-*.app.zip
          body: |
            ## Installation

            1. Download `Scribe-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG and drag **Scribe** to Applications
            3. On first launch, right-click → **Open** to bypass Gatekeeper (app is ad-hoc signed without Apple Developer ID)

            ## Requirements
            - macOS 14 (Sonoma) or later
            - Apple Silicon (M1 or later) recommended

            **ffmpeg with libass is bundled** — no separate install needed for subtitle burning.
